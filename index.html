<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Эльвина, приглашаю тебя на флорбол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #1f5fd1;
    --court-deep: #1746a2;
    --line: #ffffff;
    --ball: #ffffff;
    --ink: #0f1f3d;
    --paper: #ffffff;
    --no: #ff4d6d;
    --no-text: #ffffff;
    --yes: #ffffff;
    --yes-text: #0f1f3d;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --court: #163f8f;
      --court-deep: #0f2d68;
      --ink: #0f1f3d;
      --paper: #f7f7fb;
    }
  }
  :root[data-theme="dark"] {
    --court: #163f8f;
    --court-deep: #0f2d68;
    --ink: #0f1f3d;
    --paper: #f7f7fb;
  }

  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
    font-weight: 500;
    color: var(--paper);
    background: var(--court);
    background-image:
      radial-gradient(circle at 50% 120%, var(--court-deep) 0, transparent 55%);
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Court markings */
  .court {
    position: fixed; inset: 0; pointer-events: none; opacity: .35;
  }
  .court .line { position: absolute; border: 3px solid var(--line); }
  .court .center-line { left: 50%; top: 0; bottom: 0; width: 0; border-width: 0 0 0 3px; }
  .court .center-circle {
    left: 50%; top: 50%; width: min(42vw, 42vh); height: min(42vw, 42vh);
    transform: translate(-50%, -50%); border-radius: 50%;
  }
  .court .goal {
    left: 50%; width: min(30vw, 240px); height: min(16vh, 120px);
    transform: translateX(-50%); border-radius: 0 0 100px 100px / 0 0 60px 60px;
  }
  .court .goal.top { top: -3px; border-top: 0; }
  .court .goal.bottom { bottom: -3px; border-bottom: 0; border-radius: 100px 100px 0 0 / 60px 60px 0 0; }

  .stage {
    position: relative; height: 100%; display: grid;
    place-items: center; padding: 24px; text-align: center;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  button { touch-action: manipulation; }
  .card { max-width: 640px; width: 100%; }

  .ball {
    width: 92px; height: 92px; margin: 0 auto 10px; display: block;
    animation: bounce 1.6s cubic-bezier(.35,0,.3,1) infinite;
    transform-origin: 50% 100%;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    45%      { transform: translateY(-34px) scale(.97, 1.03); }
    50%      { transform: translateY(-36px) scale(.97, 1.03); }
    95%      { transform: translateY(0) scale(1.06, .92); }
  }

  h1 {
    font-family: "Unbounded", "Manrope", system-ui, sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 6.2vw, 52px);
    line-height: 1.06;
    letter-spacing: -0.01em;
    margin: 0 0 14px;
    text-wrap: balance;
  }
  .sub {
    font-size: clamp(16px, 2.4vw, 20px);
    line-height: 1.45; opacity: .92; margin: 0 auto 30px; max-width: 46ch;
    min-height: 2.9em;
  }
  .matchup {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    margin: 6px auto 18px;
  }
  .team {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    font-family: "Unbounded", system-ui, sans-serif; font-weight: 500;
    font-size: clamp(13px, 2vw, 16px);
  }
  .badge {
    width: 84px; height: 84px; border-radius: 50%; background: #fff;
    display: grid; place-items: center; box-shadow: 0 8px 0 rgba(0,0,0,.18);
  }
  .badge img { max-width: 60%; max-height: 60%; display: block; }
  .vs {
    font-family: "Unbounded", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(26px, 5vw, 40px); color: var(--ball); margin-bottom: 26px;
  }
  .sub { font-family: "Unbounded", system-ui, sans-serif; font-weight: 500; min-height: 0; margin-bottom: 22px; }
  .sub strong { font-weight: 700; color: var(--ball); font-family: "Manrope", system-ui, sans-serif; }

  .answers {
    display: flex; gap: 18px; justify-content: center; align-items: center;
    flex-wrap: wrap; min-height: 90px;
  }
  button {
    font: inherit; font-weight: 700; font-size: 20px; letter-spacing: .01em;
    border: 0; border-radius: 999px; padding: 18px 40px; cursor: pointer;
    transition: transform .18s cubic-bezier(.3,1.4,.6,1), font-size .25s, padding .25s;
    box-shadow: 0 10px 0 rgba(0,0,0,.18);
  }
  button:focus-visible { outline: 4px solid var(--paper); outline-offset: 3px; }
  #yes { background: var(--yes); color: var(--yes-text); }
  #yes:hover { transform: translateY(-3px) rotate(-2deg); }
  #no  { background: var(--no);  color: var(--no-text); position: relative; z-index: 2; }
  #no.fled { position: fixed; margin: 0; }

  /* Result screen */
  .result {
    position: fixed; inset: 0; display: grid; place-items: center;
    background: #f5f7fb; color: var(--ink); padding: 24px;
    opacity: 0; pointer-events: none; transition: opacity .5s;
    text-align: center;
  }
  .result.show { opacity: 1; pointer-events: auto; }
  .result h2 {
    font-family: "Unbounded", system-ui, sans-serif; font-weight: 800;
    font-size: clamp(30px, 7vw, 64px); line-height: 1.05; margin: 0 0 18px;
  }
  .details {
    font-size: clamp(17px, 2.6vw, 22px); line-height: 1.5; margin: 0 0 8px;
  }
  .details span { display: block; }
  .details b { font-weight: 700; }
  .result-logos { margin-bottom: 22px; }
  .result-logos .vs { color: var(--ink); }
  .result-logos .badge { box-shadow: 0 6px 0 rgba(15,31,61,.12); border: 2px solid rgba(15,31,61,.1); }
  .details a { color: inherit; font-size: .85em; opacity: .75; text-underline-offset: 3px; }
  .details a:hover { opacity: 1; }

  canvas.confetti { position: fixed; inset: 0; pointer-events: none; }

  @media (prefers-reduced-motion: reduce) {
    .ball { animation: none; }
    button { transition: none; }
  }
</style>
</head>

      <span id="r-match"></span>

<canvas class="confetti" id="confetti"></canvas>

<script>
  // ---------- fill texts ----------
  document.getElementById('title').textContent = `${CONFIG.name}, приглашаю тебя на флорбольный матч`;
  const sub = document.getElementById('sub');
  const baseSub = `${CONFIG.date} в ${CONFIG.time}`;
  sub.textContent = baseSub;
  document.getElementById('r-match').textContent = CONFIG.match;
  document.getElementById('r-date').textContent = CONFIG.date;
  document.getElementById('r-time').textContent = CONFIG.time;
  document.getElementById('r-place').textContent = CONFIG.place;
  const map = document.getElementById('r-map');
  map.textContent = CONFIG.venue; map.href = CONFIG.mapUrl;

  // ---------- escaping "no" ----------
  const no  = document.getElementById('no');
  const yes = document.getElementById('yes');
  const lines = [
    "Нет",
    "Точно нет?",
    "Подумай ещё",
    "Ну пожалуйста",
    "Там будет весело",
    "Клюшку выдам",
    "Я буду в воротах",
    "Кофе после — за мной",
    "Да там же мячик с дырочками!",
    "Я уже купил билеты",
    "Эта кнопка сломана",
    "Ладно, жми «Да»"
  ];
  let attempts = 0;
  let fled = false;

  function flee() {
    attempts++;
    const pad = 16;
    const rect = no.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    const maxX = window.innerWidth  - w - pad;
    const maxY = window.innerHeight - h - pad;
    let x, y, tries = 0;
    // pick a spot reasonably far from where it is now
    do {
      x = pad + Math.random() * Math.max(1, maxX - pad);
      y = pad + Math.random() * Math.max(1, maxY - pad);
      tries++;
    } while (tries < 20 && Math.hypot(x - rect.left, y - rect.top) < 160);

    if (!fled) { no.classList.add('fled'); fled = true; }
    no.style.left = x + 'px';
    no.style.top  = y + 'px';
    no.style.transform = `rotate(${(Math.random() * 30 - 15).toFixed(1)}deg)`;

    no.textContent = lines[Math.min(attempts, lines.length - 1)];

    // "yes" grows with every escape
    const scale = Math.min(1 + attempts * 0.14, 2.6);
    yes.style.fontSize = (20 * scale) + 'px';
    yes.style.padding  = (18 * scale) + 'px ' + (40 * scale) + 'px';

    if (attempts >= 3) sub.innerHTML = `${baseSub} <strong>Правильный ответ — слева.</strong>`;
    if (attempts >= 6) no.style.opacity = Math.max(.35, 1 - (attempts - 5) * 0.12);
  }

  no.addEventListener('pointerenter', flee);
  no.addEventListener('pointerdown', (e) => { e.preventDefault(); flee(); });
  no.addEventListener('touchstart', (e) => { e.preventDefault(); flee(); }, { passive: false });
  no.addEventListener('mouseenter', flee);
  no.addEventListener('click', (e) => { e.preventDefault(); flee(); });
  no.addEventListener('focus', flee);
  // keep it in view if the window changes
  window.addEventListener('resize', () => { if (fled) flee(); });

  // ---------- yes ----------
  function sayYes() {
    document.getElementById('result').classList.add('show');
    no.style.display = 'none';
    launchConfetti();
  }
  yes.addEventListener('click', sayYes);
  yes.addEventListener('touchend', (e) => { e.preventDefault(); sayYes(); }, { passive: false });

  // ---------- confetti ----------
  const cv = document.getElementById('confetti');
  const ctx = cv.getContext('2d');
  function fit() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0); }
  fit(); addEventListener('resize', fit);
  function launchConfetti() {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const colors = ['#1f5fd1', '#ff4d6d', '#0f1f3d', '#4fd1c5', '#8fb4ff'];
    const parts = Array.from({ length: 220 }, () => ({
      x: innerWidth / 2 + (Math.random() - .5) * 80,
      y: innerHeight / 2,
      vx: (Math.random() - .5) * 18,
      vy: -Math.random() * 16 - 6,
      r: Math.random() * 6 + 4,
      c: colors[Math.random() * colors.length | 0],
      a: Math.random() * Math.PI,
      va: (Math.random() - .5) * .3,
      ball: Math.random() < .25
    }));
    let frames = 0;
    (function tick() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      parts.forEach(p => {
        p.vy += .35; p.x += p.vx; p.y += p.vy; p.a += p.va; p.vx *= .99;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        if (p.ball) {
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(0, 0, p.r, 0, Math.PI * 2); ctx.fill();
          ctx.fillStyle = '#1f5fd1';
          [[0,0],[p.r*.55,0],[-p.r*.55,0],[0,p.r*.55],[0,-p.r*.55]].forEach(([dx,dy]) => {
            ctx.beginPath(); ctx.arc(dx, dy, p.r * .14, 0, Math.PI * 2); ctx.fill();
          });
        } else {
          ctx.fillStyle = p.c; ctx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2);
        }
        ctx.restore();
      });
      if (++frames < 260) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
    })();
  }
</script>
